name: urdu-translate

on:
  push:
    paths: ["urdu_translate/**", ".github/workflows/urdu-translate.yml"]
  pull_request:
    paths: ["urdu_translate/**", ".github/workflows/urdu-translate.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: urdu_translate

jobs:
  test:
    name: tests (py3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: urdu_translate/requirements-test.txt
      - name: Install torch (CPU wheel)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: System libraries (pango for WeasyPrint, poppler for pdfinfo)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 poppler-utils
      - run: pip install -r requirements-test.txt
      - name: Syntax check
        run: python -m py_compile translate_urdu_pdf.py
      - name: Run tests (OCR and NLLB are stubbed)
        run: python -m pytest -v

  resolve-requirements:
    # Checks that the pins in requirements.txt (Surya + transformers + torch) can co-exist
    # on Python 3.13. Dry run (Linux wheels; the Mac resolution differs only in torch's
    # platform wheels). Informational, so it doesn't block.
    name: requirements.txt resolves (py3.13)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --dry-run -r requirements.txt
